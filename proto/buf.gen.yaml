version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../infra/buf/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: ../infra/buf/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  - remote: buf.build/bufbuild/es
    out: ../infra/buf/ts
    opt: target=ts
inputs:
  - directory: .
