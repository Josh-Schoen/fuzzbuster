# Local-development docker-compose. Production runs services on Hetzner.
# Volumes are intentionally bound under ../data so accidental `docker compose
# down -v` doesn't wipe a Nominatim or Postgres restore.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: fuzzbuster
      POSTGRES_PASSWORD: fuzzbuster
      POSTGRES_DB: fuzzbuster
    ports:
      - "5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
      - ../pkg/db/migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ../data/redis:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ../data/ollama:/root/.ollama
    # Set OLLAMA_GPU=1 in your shell to enable GPU; we don't gate it here.

  nominatim:
    image: mediagis/nominatim:4.5
    ports:
      - "7070:8080"
    environment:
      # Default to a small Minnesota-only extract for local dev. Production
      # uses a NA extract on the Hetzner GEX44.
      PBF_URL: https://download.geofabrik.de/north-america/us/minnesota-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/north-america/us/minnesota-updates/
    volumes:
      - ../data/nominatim:/var/lib/postgresql/14/main
    shm_size: 1gb
    restart: unless-stopped
